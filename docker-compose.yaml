# Elasticsearch
services:
  elasticsearch:
    image: ${ELASTIC_IMAGE}
    container_name: ${ELASTIC_CONTAINER}
    restart: on-failure:5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Heap raised to 4 GB. Isomorphism search is the hot path: every graph
      # produced by every cfg-processor triggers 2 existence checks + 1
      # script-score query against the cfg_index. Under-heaping ES turns this
      # into the system-wide bottleneck (graph_topic lag explodes, Kibana
      # graph counts plateau). Container limit is heap + ~50% off-heap budget
      # for the Lucene segment cache.
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ports:
      - "${ELASTIC_HOST}:9200"
    volumes:
      - "./elasticsearch-data:/usr/share/elasticsearch/data"
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

# Kibana
  kibana:
    image: ${KIBANA_IMAGE}
    container_name: ${KIBANA_CONTAINER}
    restart: on-failure:5
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_HOST}:5601"
    deploy:
      resources:
        limits:
          memory: 1536M
    depends_on:
      - elasticsearch

# Kafka
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: ${KAFKA_CONTAINER}
    restart: on-failure:5
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_MS=18000000
      - KAFKA_LOG_SEGMENT_BYTES=67108864
      # Default partition count for auto-created topics. Must be >= the number
      # of cfg-processor replicas per language so each replica in the
      # `cfg_group_v2` consumer group can be assigned its own partition and
      # consume in parallel. Matches `replicas: 4` below.
      - KAFKA_NUM_PARTITIONS=4
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_HEAP_OPTS=-Xms1g -Xmx2g
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_HOST}:9092"
    volumes:
      - "./kafka-data:/var/lib/kafka/data"
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


# Url Api
  url-api:
    build:
      context: .
      dockerfile: Dockerfile.UrlApp
    container_name: url-api
    restart: on-failure:5
    ports:
      - "${URL_API_HOST}:8000"
    environment:
      KAFKA_HOST: kafka:${KAFKA_HOST}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      URL_KAFKA_TOPIC: ${URL_KAFKA_TOPIC}
      REPOS_INDEX: ${REPOS_INDEX}
      LANGUAGE_TOPICS: ${LANGUAGE_TOPICS}
      APP_NAME: ${APP_NAME}
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

# Elasticsearch Upload
# Runs as 4 replicas, each owning one partition of `graph_topic` in its own
# consumer group `upload_group_v1`. This is the dedup + isomorphism-search
# stage and was previously the system-wide bottleneck (single consumer doing
# 2 ES existence checks + 1 script_score query per graph). With 4 replicas
# the indexing throughput scales ~linearly until either ES heap or the
# cfg-processors become the next bottleneck.
#
# Note on correctness: with parallel uploaders there is a race window of
# ~refresh_interval (default 1s) during which two uploaders processing
# isomorphic graphs from different repos can BOTH miss each other in ES and
# insert two "canonical" entries that should have been one canonical + one
# isomorphism reference. Acceptable for a research workload; for stricter
# guarantees, switch the canonical insert to `op_type=create` and add a
# de-dup pass.
  elasticsearch-upload:
    build:
      context: .
      dockerfile: Dockerfile.ElasticsearchUpload
    image: elasticsearch-upload
    restart: on-failure:5
    environment:
      KAFKA_BROKER: kafka:${KAFKA_HOST}
      GRAPH_KAFKA_TOPIC: ${GRAPH_KAFKA_TOPIC}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      CFG_ISOMORPHISM_INDEX: ${CFG_ISOMORPHISM_INDEX}
      CFG_INDEX: ${CFG_INDEX}
      ERROR_INDEX: ${ERROR_INDEX}
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          memory: 1G
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy


