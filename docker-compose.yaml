version: '3.8'

# Elasticsearch
services:
  elasticsearch:
    image: ${ELASTIC_IMAGE}
    container_name: ${ELASTIC_CONTAINER}
    restart: on-failure:5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTIC_HOST}:9200"
    volumes:
      - "./elasticsearch-data:/usr/share/elasticsearch/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

# Kibana
  kibana:
    image: ${KIBANA_IMAGE}
    container_name: ${KIBANA_CONTAINER}
    restart: on-failure:5
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_HOST}:5601"
    depends_on:
      - elasticsearch

# Kafka
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: ${KAFKA_CONTAINER}
    restart: on-failure:5
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_MS=18000000
      - KAFKA_LOG_SEGMENT_BYTES=67108864
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_HOST}:9092"
    volumes:
      - "./kafka-data:/var/lib/kafka/data"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


# Url Api
  url-api:
    build:
      context: .
      dockerfile: Dockerfile.UrlApp
    container_name: url-api
    restart: on-failure:5
    ports:
      - "${URL_API_HOST}:8000"
    environment:
      KAFKA_HOST: kafka:${KAFKA_HOST}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      URL_KAFKA_TOPIC: ${URL_KAFKA_TOPIC}
      REPOS_INDEX: ${REPOS_INDEX}
      LANGUAGE_TOPICS: ${LANGUAGE_TOPICS}
      APP_NAME: ${APP_NAME}
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

# Elasticsearch Upload
  elasticsearch-upload:
    build:
      context: .
      dockerfile: Dockerfile.ElasticsearchUpload
    container_name: elasticsearch-upload
    restart: on-failure:5
    environment:
      KAFKA_BROKER: kafka:${KAFKA_HOST}
      GRAPH_KAFKA_TOPIC: ${GRAPH_KAFKA_TOPIC}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      CFG_ISOMORPHISM_INDEX: ${CFG_ISOMORPHISM_INDEX}
      CFG_INDEX: ${CFG_INDEX}
      ERROR_INDEX: ${ERROR_INDEX}
      
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy


# CFG Processor settings (Python)
  cfg-processor-python:
    build:
      context: .
      dockerfile: Dockerfile.CfgProcessorPython
    container_name: cfg-processor-python
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      LANGUAGE: ${PYTHON_CFG_LANGUAGE}
      EXTENSION: ${PYTHON_CFG_EXTENSION}
      KAFKA_BROKER: kafka:${KAFKA_HOST}
      GRAPH_KAFKA_TOPIC: ${GRAPH_KAFKA_TOPIC}
      LANGUAGE_TOPICS: ${LANGUAGE_TOPICS}
      REPO_SCRIPT: ${PYTHON_CFG_REPO_SCRIPT}
      CFG_BUILD_SCRIPT: ${PYTHON_CFG_BUILD_SCRIPT}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      ERROR_INDEX: ${ERROR_INDEX}
      REPO_FOLDER: ${PYTHON_REPO_FOLDER}
    depends_on:
      kafka:
        condition: service_healthy  
      elasticsearch:
        condition: service_healthy

# CFG Processor settings (CPP)
  cfg-processor-cpp:
    build:
      context: .
      dockerfile: Dockerfile.CfgProcessorCpp
    container_name: cfg-processor-cpp
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      LANGUAGE: ${CPP_CFG_LANGUAGE}
      EXTENSION: ${CPP_CFG_EXTENSION}
      KAFKA_BROKER: kafka:${KAFKA_HOST}
      GRAPH_KAFKA_TOPIC: ${GRAPH_KAFKA_TOPIC}
      LANGUAGE_TOPICS: ${LANGUAGE_TOPICS}
      REPO_SCRIPT: ${CPP_CFG_REPO_SCRIPT}
      CFG_BUILD_SCRIPT: ${CPP_CFG_BUILD_SCRIPT}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      ERROR_INDEX: ${ERROR_INDEX}
      LOGGING_TO_ELASTIC: ${LOGGING_TO_ELASTIC}
      REPO_FOLDER: ${CPP_REPO_FOLDER}

    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

# CFG Processor settings (Java)
  cfg-processor-java:
    build:
      context: .
      dockerfile: Dockerfile.CfgProcessorJava
    container_name: cfg-processor-java
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "${JAVA_CFG_REMOTE_DEBUG_HOST_PORT}:${JAVA_CFG_REMOTE_DEBUG_PORT}"
    environment:
      LANGUAGE: ${JAVA_CFG_LANGUAGE}
      EXTENSION: ${JAVA_CFG_EXTENSION}
      KAFKA_BROKER: kafka:${KAFKA_HOST}
      GRAPH_KAFKA_TOPIC: ${GRAPH_KAFKA_TOPIC}
      LANGUAGE_TOPICS: ${LANGUAGE_TOPICS}
      REPO_SCRIPT: ${JAVA_CFG_REPO_SCRIPT}
      CFG_BUILD_SCRIPT: ${JAVA_CFG_BUILD_SCRIPT}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      ERROR_INDEX: ${ERROR_INDEX}
      LOGGING_TO_ELASTIC: ${LOGGING_TO_ELASTIC}
      REPO_FOLDER: ${JAVA_REPO_FOLDER}
      JAVA_CFG_CLI_CMD: ${JAVA_CFG_CLI_CMD}
      JAVA_ALLOW_WRAPPER_DOWNLOADS: ${JAVA_ALLOW_WRAPPER_DOWNLOADS}
      JAVA_BUILD_OFFLINE: ${JAVA_BUILD_OFFLINE}
      JAVA_CFG_REMOTE_DEBUG: ${JAVA_CFG_REMOTE_DEBUG}
      JAVA_CFG_REMOTE_DEBUG_PORT: ${JAVA_CFG_REMOTE_DEBUG_PORT}
      JAVA_CFG_REMOTE_DEBUG_SUSPEND: ${JAVA_CFG_REMOTE_DEBUG_SUSPEND}
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

