# CFG Processor settings (JavaScript)
# Runs as 4 replicas. All replicas join the Kafka consumer group `cfg_group_v2`
# and each is assigned a distinct partition of the `javascript` topic, so they
# process repos in parallel without overlap. `container_name` is intentionally
# omitted; Compose names replicas <project>-cfg-processor-javascript-{1..4}.
#
# Why 4 (and not 6+)? With a single elasticsearch-upload consumer downstream,
# anything past ~5 replicas per language saturates the uploader: cfg-processors
# generate graphs faster than they can be deduplicated and indexed, so
# graph_topic lag grows unbounded and Kibana counts plateau even though the
# workers look CPU-busy. To safely scale past 8 total cfg-processors, also
# replicate `elasticsearch-upload` (it already uses a Kafka consumer group)
# and bump KAFKA_NUM_PARTITIONS for graph_topic to match.
#
# Memory limit 1G based on observed peak ~200 MiB (5x safety). Raise to 1.5–2G
# only if you scrape repos with huge minified bundles.
  cfg-processor-javascript:
    build:
      context: .
      dockerfile: Dockerfile.CfgProcessorJavaScript
    image: cfg-processor-javascript
    restart: on-failure:5
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          memory: 1G
    environment:
      LANGUAGE: ${JS_CFG_LANGUAGE}
      EXTENSION: ${JS_CFG_EXTENSION}
      KAFKA_BROKER: kafka:${KAFKA_HOST}
      GRAPH_KAFKA_TOPIC: ${GRAPH_KAFKA_TOPIC}
      LANGUAGE_TOPICS: ${LANGUAGE_TOPICS}
      REPO_SCRIPT: ${JS_CFG_REPO_SCRIPT}
      CFG_BUILD_SCRIPT: ${JS_CFG_BUILD_SCRIPT}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      ERROR_INDEX: ${ERROR_INDEX}
      LOGGING_TO_ELASTIC: ${LOGGING_TO_ELASTIC}
      REPO_FOLDER: ${JS_REPO_FOLDER}
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

# CFG Processor settings (TypeScript)
# Same replica strategy and sizing as the JavaScript processor.
  cfg-processor-typescript:
    build:
      context: .
      dockerfile: Dockerfile.CfgProcessorTypeScript
    image: cfg-processor-typescript
    restart: on-failure:5
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          memory: 1G
    environment:
      LANGUAGE: ${TS_CFG_LANGUAGE}
      EXTENSION: ${TS_CFG_EXTENSION}
      KAFKA_BROKER: kafka:${KAFKA_HOST}
      GRAPH_KAFKA_TOPIC: ${GRAPH_KAFKA_TOPIC}
      LANGUAGE_TOPICS: ${LANGUAGE_TOPICS}
      REPO_SCRIPT: ${TS_CFG_REPO_SCRIPT}
      CFG_BUILD_SCRIPT: ${TS_CFG_BUILD_SCRIPT}
      ELASTIC_HOST: http://elasticsearch:${ELASTIC_HOST}
      ERROR_INDEX: ${ERROR_INDEX}
      LOGGING_TO_ELASTIC: ${LOGGING_TO_ELASTIC}
      REPO_FOLDER: ${TS_REPO_FOLDER}
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

